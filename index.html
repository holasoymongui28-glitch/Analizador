<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON SHIELD — Analizador de Contraseñas</title>
    <!-- Tailwind CSS para el diseño base rápido -->
    <script src="https://jsdelivr.net"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com"></script>
    <!-- GSAP para animaciones fluidas y Motion Graphics -->
    <script src="https://cloudflare.com"></script>
    <!-- Google Fonts Premium -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            background-color: #050505;
        }
        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Efecto Foco de Luz Interactiva (Spotlight) */
        .spotlight-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(
                600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(0, 102, 255, 0.08),
                transparent 80%
            );
            transition: background 0.1s ease;
        }
        /* Efecto de Brillo Neón en Tarjetas */
        .tech-card {
            position: relative;
            background: rgba(13, 13, 13, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            z-index: 2;
        }
        .tech-card:hover {
            border-color: rgba(0, 255, 102, 0.3);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.1);
            transform: translateY(-4px) scale(1.01);
        }
        /* Cursor personalizado */
        .custom-cursor {
            width: 8px;
            height: 8px;
            background: #00ff66;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }
        .custom-cursor-outline {
            width: 24px;
            height: 24px;
            border: 1px solid rgba(0, 255, 102, 0.4);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out, width 0.2s, height 0.2s, border-color 0.2s;
        }
        .expand-cursor {
            width: 16px;
            height: 16px;
            background-color: #0066ff;
        }
        .expand-cursor-outline {
            width: 40px;
            height: 40px;
            border-color: rgba(0, 102, 255, 0.6);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between antialiased selection:bg-emerald-500 selection:text-black">

    <!-- Elementos del Cursor Personalizado e Interactivo -->
    <div class="custom-cursor hidden md:block" id="cDot"></div>
    <div class="custom-cursor-outline hidden md:block" id="cOutline"></div>

    <!-- Capa del Foco de Luz de Fondo -->
    <div class="spotlight-bg" id="spotlight"></div>

    <!-- Encabezado de la Aplicación -->
    <header class="border-b border-slate-900 bg-black/60 backdrop-blur-md px-6 py-4 flex justify-between items-center z-10 relative">
        <div class="flex items-center gap-2 text-emerald-400 font-bold text-lg tracking-widest font-mono-tech">
            <i data-lucide="shield-alert" class="animate-pulse"></i> NEON_SHIELD
        </div>
        <div class="flex items-center gap-2 text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-full border border-emerald-500/20 font-mono-tech">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> PROCESAMIENTO 100% LOCAL
        </div>
    </header>

    <!-- Contenedor de Tres Columnas de la Aplicación -->
    <div class="max-w-[1400px] w-full mx-auto flex-grow flex flex-col lg:flex-row gap-6 p-4 lg:p-6 justify-center items-stretch relative z-20">
        
        <!-- COLUMNA IZQUIERDA: Anuncio Rascacielos 160x600 -->
        <aside class="w-full lg:w-[160px] flex flex-col items-center justify-start lg:shrink-0 order-2 lg:order-1 mt-4 lg:mt-0">
            <div class="sticky top-24 bg-neutral-950 p-1 border border-neutral-900 rounded-xl overflow-hidden shadow-2xl max-w-[160px] w-full min-h-[600px] flex items-center justify-center">
                <!-- ADSTERRA: Script Banner 160x600 Izquierdo -->
                <script>
                  atOptions = {
                    'key' : '9eb5688d177646d2180f72a2ce5b894d',
                    'format' : 'iframe',
                    'height' : 600,
                    'width' : 160,
                    'params' : {}
                  };
                </script>
                <script src="https://bauval.org"></script>
            </div>
        </aside>

        <!-- COLUMNA CENTRAL: Núcleo del Analizador e Interfaz Gráfica -->
        <main class="flex-grow max-w-[800px] flex flex-col gap-6 order-1 lg:order-2">
            
            <!-- ANUNCIO HORIZONTAL SUPERIOR 728x90 -->
            <div class="w-full bg-neutral-950 p-1 border border-neutral-900 rounded-xl overflow-hidden shadow-xl flex justify-center items-center min-h-[90px]">
                <!-- ADSTERRA: Script Banner Horizontal 728x90 -->
                <script>
                  atOptions = {
                    'key' : '262a9cb086b1e4b03109271538487464',
                    'format' : 'iframe',
                    'height' : 90,
                    'width' : 728,
                    'params' : {}
                  };
                </script>
                <script src="https://bauval.org"></script>
            </div>

            <!-- CARD PRINCIPAL: MÓDULO 01 / ESCÁNER -->
            <section class="tech-card rounded-2xl p-6 lg:p-8" id="mod1">
                <div class="flex justify-between items-center mb-6 border-b border-slate-800/60 pb-4">
                    <div>
                        <span class="text-xs font-mono-tech text-blue-500 uppercase tracking-widest">01 / VERIFICACIÓN DE CREDENCIALES</span>
                        <h2 class="text-2xl font-bold tracking-tight mt-1 text-white">Tu contraseña, bajo análisis</h2>
                    </div>
                    <i data-lucide="terminal" class="text-slate-600 w-6 h-6"></i>
                </div>

                <div class="space-y-4">
                    <label class="text-xs font-mono-tech text-slate-400 uppercase tracking-wider">Introduce una clave de acceso (Prueba variantes por precaución)</label>
                    <div class="relative">
                        <input type="password" id="passInput" placeholder="> Esperando secuencia..." 
                            class="interactive-element w-full bg-neutral-950 border border-slate-800 rounded-xl px-5 py-4 pr-14 text-emerald-400 focus:outline-none focus:border-blue-500 transition-colors font-mono-tech text-lg tracking-wide shadow-inner">
                        <button id="btnToggle" class="interactive-element absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors p-1">
                            <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Barra de Robustez con Animación GSAP -->
                <div class="mt-6 space-y-2">
                    <div class="flex justify-between text-xs font-mono-tech">
                        <span class="text-slate-500">Nivel de Seguridad:</span>
                        <span id="lblStrength" class="font-bold uppercase tracking-wider text-slate-400 text-shadow-glow">En Espera</span>
                    </div>
                    <div class="h-1.5 w-full bg-neutral-950 rounded-full overflow-hidden flex gap-1.5 p-0.5 border border-slate-900">
                        <div id="meter" class="h-full w-0 bg-neutral-800 rounded-full transition-all duration-300"></div>
                    </div>
                </div>
            </section>

            <!-- CARD RECTÁNGULO: MÓDULO 02 / FUERZA BRUTA -->
            <section class="tech-card rounded-2xl p-6" id="mod2">
                <div class="flex justify-between items-center mb-4 border-b border-slate-800/60 pb-3">
                    <div>
                        <span class="text-xs font-mono-tech text-blue-500 uppercase tracking-widest">02 / RESISTENCIA A FUERZA BRUTA</span>
                        <h3 class="text-lg font-bold text-white mt-0.5">Tiempo estimado de descubrimiento</h3>
                    </div>
                    <i data-lucide="cpu" class="text-slate-600 w-5 h-5"></i>
                </div>
                <div class="bg-neutral-950/80 rounded-xl p-5 border border-slate-900 text-center md:text-left flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <div class="text-3xl lg:text-4xl font-bold tracking-tight text-white font-mono-tech text-shadow-glow" id="lblCrackTime">—</div>
                        <p class="text-xs text-slate-500 mt-1">Escenario matemático hipotético frente a ataques simultáneos por IA.</p>
                    </div>
